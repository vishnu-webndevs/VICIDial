<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="500" height="500" x="6" y="6" rx="122" stroke="url(#borderGrad)" stroke-width="8" stroke-opacity="0.4"/>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#818CF8"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="60" y1="60" x2="450" y2="450" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="0.4" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
  </defs>

  <!-- WND Ribbon Mark (matching logo style) -->
  <g transform="translate(156, 54)">
    <path d="M 120 40 C 40 40 10 90 10 140 C 10 200 80 230 130 250 C 190 274 240 300 240 350 C 240 395 190 420 120 420 C 60 420 20 380 20 380" 
          stroke="url(#brandGrad)" stroke-width="56" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Bold WND Text -->
  <text x="256" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="140" fill="#FFFFFF" text-anchor="middle" letter-spacing="-2">WND</text>
  <text x="256" y="395" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="700" font-size="44" fill="#818CF8" text-anchor="middle" letter-spacing="6">DIALER</text>
</svg>
